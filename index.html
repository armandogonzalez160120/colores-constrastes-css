<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colores y contrastes</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="encabezado">
    <h1>Portal del estudiante</h1>
    <p>Práctica de color, contraste y accesibilidad</p>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2>Avisos</h2>
      <p>Revisa las fechas de entrega de tus actividades.</p>
      <a href="#">Consultar calendario</a>
    </section>

    <section class="tarjeta">
      <h2>Estado de entrega</h2>
      <p class="estado exito">Actividad entregada</p>
      <p class="estado error">Actividad pendiente</p>
      <button>Enviar actividad</button>
    </section>
  </main>
</body>
</html>
